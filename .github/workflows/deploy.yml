name: Build and Push to build branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://crypto-pulse-api.tolemak.pl
      - run: cp .htaccess dist/
      - name: Push dist to build branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan build
          git --work-tree dist add --all
          git --work-tree dist commit -m 'Build: ${{ github.sha }}'
          git push origin HEAD:build --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Mikrus
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '[konrad192.mikrus.xyz]:10192 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKISUA7JlS13WF3PQaRdtugdoIwiQWt7QrMuLEJ3wQxy' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 10192 root@konrad192.mikrus.xyz "crypto-pulse-frontend"
