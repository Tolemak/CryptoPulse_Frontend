name: Build and Push to build branch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Tolemak/.github/.github/workflows/node-ci.yml@v1
    with:
      node-version: "22"
      test-command: npm run test:coverage
      build-command: VITE_API_BASE_URL=https://crypto-pulse-api.tolemak.pl npm run build
      artifact-name: dist
      artifact-include-hidden-files: true

  static:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/tolemak/cryptopulse-frontend-static
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Package the site
        run: |
          test -f dist/index.html
          docker build --provenance=false -f - \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" . <<'EOF'
          FROM scratch
          COPY dist /site
          EOF

      - name: Smoke test the package
        run: |
          cid=$(docker create "$IMAGE:${{ github.sha }}" /none)
          docker cp "$cid:/site" packaged
          docker rm "$cid"
          diff -r dist packaged

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        id: push
        run: |
          docker push --quiet "$IMAGE:${{ github.sha }}"
          docker push --quiet "$IMAGE:latest"
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
