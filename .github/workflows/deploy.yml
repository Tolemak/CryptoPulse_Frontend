name: Build and Push to build branch

on:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Tolemak/.github/.github/workflows/node-ci.yml@b2d0751e30f19a20e966a927c4de3fd089edc83d # v2.0.1
    with:
      node-version: "22"
      test-command: npm run test:coverage
      coverage-file: coverage/cobertura-coverage.xml
      coverage-artifact: coverage-frontend
      build-command: VITE_API_BASE_URL=https://crypto-pulse-api.tolemak.pl npm run build
      artifact-name: dist
      artifact-include-hidden-files: true

  quality-gate:
    needs: [ci]
    if: ${{ !cancelled() }}
    uses: Tolemak/.github/.github/workflows/quality-gate.yml@b2d0751e30f19a20e966a927c4de3fd089edc83d # v2.0.1
    with:
      needs: ${{ toJSON(needs) }}
      semgrep-exclude-rules: missing-integrity

  static:
    needs: [ci, quality-gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/tolemak/cryptopulse-frontend-static
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Package the site
        run: |
          test -f dist/index.html
          docker build --provenance=false -f - \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" . <<'EOF'
          FROM scratch
          COPY dist /site
          EOF

      - name: Smoke test the package
        run: |
          cid=$(docker create "$IMAGE:${{ github.sha }}" /none)
          docker cp "$cid:/site" packaged
          docker rm "$cid"
          diff -r dist packaged

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        id: push
        run: |
          docker push --quiet "$IMAGE:${{ github.sha }}"
          docker push --quiet "$IMAGE:latest"
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
